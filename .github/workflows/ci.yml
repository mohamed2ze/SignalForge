name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #--------------------------------------------------------------
  # Secret scan — fails if a credential literal lands in tracked
  # sources. Scans src/, workflows, compose, and root config.
  # tests/ is excluded (Testcontainers/seed fixtures) and .env is
  # gitignored (never on a runner); .env.example is excluded as an
  # exemplar template with placeholder values. Env-var references
  # (${VAR}) in compose are allowed — they hold no secret literal.
  #--------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for credential literals
        run: |
          set +e
          # The Password/PWD branch ignores dot-qualified values (e.g. "string.Empty" in C#
          # member assignments such as UriBuilder.Password = string.Empty) while still catching
          # literal secrets (plain text, quoted, or embedded in a larger string).
          grep -rn -P -i \
            -e '(Password|PWD)[ ]*=[ \t]*(?!\$\{)[^ \t;\r\n"'"'"'\$\.]{8,}|SA_PASSWORD[ \t]*[:=][ \t]*(?!\$\{)[^ \t"\r\n\$]{6,}|(DefaultApiKey|X-API-Key|API_KEY)[ \t]*[:=][ \t]*["'"'"']?[A-Za-z0-9+/=_\-]{12,}|(^|[^A-Za-z0-9])AKIA[0-9A-Z]{16}($|[^A-Za-z0-9])|(^|[^A-Za-z0-9])gh[po]_[A-Za-z0-9]{36}($|[^A-Za-z0-9])|---BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            -- src .github docker-compose.yml .editorconfig SignalForge.slnx dotnet-tools.json README.md 2>/dev/null
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "::error::Potential credential literal detected in tracked files. Move it to .env / user-secrets."
            exit 1
          fi
          echo "No credential literals found."

  #--------------------------------------------------------------
  # Build + test gate — runs on every push/PR. Integration tests
  # use Testcontainers, so the runner must have Docker (it does on
  # the default ubuntu-latest image).
  #--------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore SignalForge.slnx

      - name: Format gate (whitespace/style/analyzers)
        run: dotnet format SignalForge.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build SignalForge.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test SignalForge.slnx -c Release --no-build

  #--------------------------------------------------------------
  # Image publish — explicit only (workflow_dispatch or tag push).
  # Skipped entirely on normal pushes/PRs, so running CI never
  # requires registry credentials.
  #--------------------------------------------------------------
  docker-push:
    name: Publish Docker images (GHCR)
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SignalForge.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/signalforge-api:latest
            ghcr.io/${{ github.repository }}/signalforge-api:${{ github.sha }}

      - name: Build & push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SignalForge.Worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/signalforge-worker:latest
            ghcr.io/${{ github.repository }}/signalforge-worker:${{ github.sha }}