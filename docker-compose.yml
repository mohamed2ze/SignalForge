#------------------------------------------------------------------
# SignalForge full stack — SQL Server 2022 + API + Outbox worker.
# Copy .env.example to .env and fill in the values; .env is gitignored.
#   docker compose up -d --build
#   curl -H "X-API-Key: <SEED_API_KEY>" http://localhost:5089/api/workflows
#   docker compose down
#------------------------------------------------------------------
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: signalforge-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: 1024
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # Only consumed by the startup bootstrap; the app never uses the SA login.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      # NOTE: the mssql image does not auto-run scripts in /docker-entrypoint-initdb.d.
      # Least-privilege bootstrap happens via the one-shot `db-init` service below
      # (creates the signalforge_app login/db_owner so the API/worker never use sa).
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - signalforge

  # One-shot least-privilege bootstrap: runs mssql/init/01-create-app-login.sh exactly
  # once per up, creating the signalforge_app login + SignalForge DB (idempotently).
  # The API and worker wait for it via service_completed_successfully.
  db-init:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: signalforge-db-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      DB_HOST: mssql
    volumes:
      - ./mssql/init:/init:ro
    command: bash -c 'until /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null 2>/dev/null; do sleep 2; done; bash /init/01-create-app-login.sh'
    restart: "no"
    networks:
      - signalforge

  api:
    build:
      context: .
      dockerfile: src/SignalForge.Api/Dockerfile
    container_name: signalforge-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Logging__Console__Json: "true"
      ConnectionStrings__SignalForgeConnection: "Server=mssql;Database=SignalForge;User Id=signalforge_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Migrations__AutoApply: "true"
      Seed__Enabled: "true"
      # TenantId left unset -> DatabaseSeeder.DefaultTenantId is used.
      Seed__TenantName: "compose-seeded-tenant"
      Seed__ApiKeyName: "compose-seeded-key"
      Seed__DefaultApiKey: ${SEED_API_KEY:?set SEED_API_KEY in .env}
      Seed__SigningSecret: ${SEED_SIGNING_SECRET:?set SEED_SIGNING_SECRET in .env}
    ports:
      - "5089:8080"
    healthcheck:
      # Readiness-probe the API: unhealthy until the database is migrated and reachable.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: on-failure
    networks:
      - signalforge

  worker:
    build:
      context: .
      dockerfile: src/SignalForge.Worker/Dockerfile
    container_name: signalforge-worker
    depends_on:
      # Start only after the API is healthy so the schema is migrated before the first poll
      # (avoids the transient "invalid object name" noise on a fresh database).
      api:
        condition: service_healthy
      mssql:
        condition: service_healthy
    environment:
      Logging__Console__Json: "true"
      ConnectionStrings__SignalForgeConnection: "Server=mssql;Database=SignalForge;User Id=signalforge_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    restart: on-failure
    networks:
      - signalforge

volumes:
  mssql-data:

networks:
  signalforge: